[project]
name = "kanban-mes"
version = "0.1.0"
description = "Kanban MES — folhas kanban manuscritas (foto + OCR) cruzadas contra o plano de produção no Postgres"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "pillow>=10.0",
    "opencv-python-headless>=4.10",
    "tzdata>=2024.1",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
