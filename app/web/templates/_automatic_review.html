{% if not is_raw and not readonly and automatic_review_needed %}
<div class="alert info" data-automatic-review="/sheet/{{ sheet.uid }}/automatic-review" data-revision="{{ sheet.revision }}">A verificar automaticamente a folha…</div>
<script src="/static/automatic-review.js" defer></script>
{% elif not is_raw and not readonly and automatic_review_job and automatic_review_job.status == 'error' %}
<div class="alert warn">{{ automatic_review_job.error }}</div>
{% endif %}
